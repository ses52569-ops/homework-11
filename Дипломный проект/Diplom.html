<!doctype html>
<html class="Page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>E-commerce</title>
		<link rel="stylesheet" href="./CSS/index.css" />
	</head>
	<body Page__body>
		<main>
			<header class="header">
				<div class="container header__container">
					<a href="#" class="header__logo logo">
						<img
							src="./Icons/logo.svg"
							width="166"
							height="22"
							alt="Логотип shop.co"
						/>
					</a>
					<ul class="header__menu">
						<li class="header__menu-item">
							<a
								class="header__menu-item-link header__menu-item-link-menu"
								href="#"
								>Магазин
								<img
									class="header_menu-item-arrow"
									src="./Icons/arrow-down.svg"
									alt="Одиночная стрелка вниз"
							/></a>
						</li>
						<li class="header__menu-item">
							<a class="header__menu-item-link" href="#">Скидки</a>
						</li>
						<li class="header__menu-item">
							<a class="header__menu-item-link" href="#">Новые поступления</a>
						</li>
						<li class="header__menu-item">
							<a class="header__menu-item-link" href="#">Бренды</a>
						</li>
					</ul>
					<div class="header__search">
						<label class="header__search-label">
							<button class="header__search-button">
								<img
									class=""
									src="./Icons/search.svg"
									width="24"
									height="24"
									alt="Значок поиска"
								/>
							</button>
							<input
								class="header__search-input"
								type="text"
								placeholder="Искать товары..."
								name="search"
								required
							/>
						</label>
					</div>
					<div class="header__actions">
						<button class="header__actions-button-search">
							<img class="" src="./Icons/search.svg" alt="Значок поиска" />
						</button>
						<button
							class="header__actions-button"
							title="Поиск"
							aria-label="Поиск"
						>
							<svg width="24" height="24">
								<use class="header__actions-icon" href="./icons/cart.svg"></use>
							</svg>
						</button>
						<button
							class="header__actions-button"
							title="Личный кабинет"
							aria-label="Личный кабинет"
						>
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icons/person.svg"
								></use>
							</svg>
						</button>
					</div>
				</div>
			</header>
		</main>
	</body>
</html>
