<!doctype html>
<html class="Page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>E-commerce</title>
		<link rel="stylesheet" href="./css/index.css" />
		<script defer src="./js/index.js" type="module"></script>
		<script defer src="./js/burger.js" type="module"></script>
	</head>
	<body Page__body>
		<main>
			<header class="header">
				<div class="container header__container">
					<div class="header__burger-logo">
						<button
							class="header__burger burger"
							aria-label="Открыть меню"
							aria-expanded="false"
							aria-controls="header__menu"
						>
							<svg width="24" height="24">
								<use class="burger__icon-menu" href="./icons/Burger.svg"></use>
								<use class="burger__icon-cross" href="./icons/cross.svg"></use>
							</svg>
						</button>
						<a href="#" class="header__logo logo">
							<img
								src="./icons/logo.svg"
								width="166"
								height="22"
								alt="Логотип shop.co"
							/>
						</a>
					</div>
					<ul class="header__menu">
						<li class="header__menu-item header__menu-shop">
							<a
								class="header__menu-item-link header__menu-item-link-menu"
								href="#"
								>Магазин
							</a>
							<button class="header_menu-button-arrow">
								<svg width="12" height="7">
									<use
										class="header_menu-button-arrow-icon"
										href="./icons/arrow-down.svg"
									></use>
								</svg>
							</button>
						</li>
						<li class="header__menu-item">
							<a class="header__menu-item-link" href="#">Скидки</a>
						</li>
						<li class="header__menu-item">
							<a class="header__menu-item-link" href="#">Новые поступления</a>
						</li>
						<li class="header__menu-item">
							<a class="header__menu-item-link" href="#">Бренды</a>
						</li>
					</ul>
					<div class="header__search">
						<label class="header__search-label">
							<button class="header__search-button">
								<img
									class=""
									src="./icons/search.svg"
									width="24"
									height="24"
									alt="Значок поиска"
								/>
							</button>
							<input
								class="header__search-input"
								type="text"
								placeholder="Искать товары..."
								name="search"
								required
							/>
						</label>
					</div>
					<div class="header__actions">
						<button
							title="Поиск"
							aria-label="Поиск"
							class="header__actions-button--search"
						>
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icons/search-actions.svg"
								></use>
							</svg>
						</button>
						<button
							class="header__actions-button"
							title="Корзина"
							aria-label="Корзина"
						>
							<svg width="24" height="24">
								<use class="header__actions-icon" href="./icons/cart.svg"></use>
							</svg>
						</button>
						<button
							class="header__actions-button"
							title="Личный кабинет"
							aria-label="Личный кабинет"
						>
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icons/person.svg"
								></use>
							</svg>
						</button>
					</div>
				</div>
			</header>
			<section class="section hero_section">
				<div class="container hero__container">
					<div class="hero__wrapper">
						<div class="hero__main-info">
							<h1 class="hero__title title-large">
								НАЙДИ ОДЕЖДУ КОТОРАЯ ВЫРАЗИТ ТВОЙ СТИЛЬ
							</h1>
							<p class="hero__main-info-text text-comment">
								Просмотрите наш набор тщательно сделанной одежды, созданный
								чтобы подчеркнуть ваш индивидуальный стиль.
							</p>
							<button class="hero__main-info-button">Купить сейчас</button>
							<div class="hero__main-info-achivements">
								<div class="hero__achivements">
									<h3 class="hero__achivements-number">200+</h3>
									<p class="hero__achivements-text text-comment">
										Всемирных брендов
									</p>
								</div>
								<div class="hero__achivements">
									<h3 class="hero__achivements-number">2000+</h3>
									<p class="hero__achivements-text text-comment">
										Качественных товаров
									</p>
								</div>
								<div class="hero__achivements">
									<h3 class="hero__achivements-number">30,000+</h3>
									<p class="hero__achivements-text text-comment">
										Счастливых клиентов
									</p>
								</div>
							</div>
						</div>
						<div class="hero__img">
							<svg width="56" height="56">
								<use
									class="hero__black-star"
									href="./icons/black-star.svg"
								></use>
							</svg>
							<svg width="56" height="56">
								<use
									class="hero__black-star"
									href="./icons/black-star.svg"
								></use>
							</svg>
						</div>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
